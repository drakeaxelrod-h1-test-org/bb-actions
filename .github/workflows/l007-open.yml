name: l007-open
on:
  workflow_dispatch:
    inputs:
      mode:
        description: none or call
        default: none
permissions:
  contents: read
  id-token: write
jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - run: echo "l007-open mode=${{ inputs.mode }} actor=${{ github.actor }}"
  call:
    if: inputs.mode == 'call'
    uses: ./.github/workflows/l007-protected.yml
