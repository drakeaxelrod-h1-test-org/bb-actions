name: l007-open
on:
  workflow_dispatch:
    inputs:
      mode:
        description: none, dispatch or call
        default: none
permissions:
  actions: write
  contents: read
jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - run: echo "l007-open mode=${{ inputs.mode }} actor=${{ github.actor }}"
      - if: inputs.mode == 'dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run l007-protected.yml --repo ${{ github.repository }} --ref main
  call:
    if: inputs.mode == 'call'
    uses: ./.github/workflows/l007-protected.yml
